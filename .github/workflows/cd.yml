# ══════════════════════════════════════════════════════════════════════
#  BalanceCycle — Continuous Deployment (GitHub Actions)
#
#  Triggers  : Push to `main` branch ONLY, after CI passes
#
#  Strategy  : Option A (default) — Render auto-deploys on every push
#              to main via its native GitHub integration. This workflow
#              acts as a quality gate — it re-runs CI checks and then
#              optionally pings Render Deploy Hooks for explicit control.
#
#  Optional  : Set RENDER_DEPLOY_HOOK_BACKEND and/or
#              RENDER_DEPLOY_HOOK_FRONTEND as GitHub repository secrets
#              to trigger deploys via hooks (Option B: explicit deploys).
#              Leave these secrets unset if you rely on Render's native
#              auto-deploy (Option A).
#
#  How to get Deploy Hook URLs:
#    Render Dashboard → Service → Settings → Deploy Hook → Copy URL
#    GitHub → Settings → Secrets → Actions → New repository secret
# ══════════════════════════════════════════════════════════════════════

name: CD

on:
  push:
    branches:
      - main

# Only one deploy should run at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false  # Do NOT cancel in-flight deploys

jobs:
  # ────────────────────────────────────────────────────────────────────
  #  Quality gate — re-run CI before deploying
  # ────────────────────────────────────────────────────────────────────
  backend-checks:
    name: "Backend — pre-deploy checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=app/alembic/versions/

      - name: Run pytest
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "test"
        run: pytest tests/ -v --tb=short

  frontend-checks:
    name: "Frontend — pre-deploy checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --frozen-lockfile

      - name: Lint with oxlint
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_API_URL: "https://ci-placeholder.example.com"
        run: npm run build

  # ────────────────────────────────────────────────────────────────────
  #  Deploy — trigger Render via Deploy Hooks (Option B)
  #
  #  This job only runs when RENDER_DEPLOY_HOOK_BACKEND or
  #  RENDER_DEPLOY_HOOK_FRONTEND secrets are configured.
  #  If neither secret is set, Render's native auto-deploy handles it.
  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to Render"
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    environment: production
    # Only proceed if both quality gates passed
    if: ${{ success() }}

    steps:
      - name: Trigger Render backend deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND != '' }}
        run: |
          echo "🚀 Triggering backend deploy on Render..."
          curl -s --fail \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"

      - name: Trigger Render frontend deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
        run: |
          echo "🚀 Triggering frontend deploy on Render..."
          curl -s --fail \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"

      - name: Deploy summary
        run: |
          echo "## ✅ Deploy triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Monitor deploys at [Render Dashboard](https://dashboard.render.com)" >> $GITHUB_STEP_SUMMARY
