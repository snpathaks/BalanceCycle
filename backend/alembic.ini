# A generic, single database configuration.
# Generated skeleton — run `alembic init app/alembic` to populate fully,
# or use the file as-is after adjusting sqlalchemy.url below.

[alembic]
# Path to migration scripts
script_location = app/alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Sys path prepending (keep empty — FastAPI project root is used)
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Version location specification
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/foo/versions

# Version path separator — use the default (os separator)
# version_path_separator = os

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# --- SQLAlchemy connection ---
# IMPORTANT: This is overridden in env.py by app.core.config.settings.DATABASE_URL
# Leave the placeholder here for alembic offline mode only.
sqlalchemy.url = postgresql+psycopg://postgres:yourpassword@localhost:5432/herbalancedcycle


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
