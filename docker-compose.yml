# ══════════════════════════════════════════════════════════════════════
#  BalanceCycle — Docker Compose
#
#  Services:
#    db       — PostgreSQL 16
#    ollama   — Local LLM server (llama3.1)
#    backend  — FastAPI + uvicorn
#    frontend — Vite build served by nginx
#
#  Usage:
#    docker compose up --build          # first run (pulls + builds)
#    docker compose up -d               # subsequent runs (detached)
#    docker compose down -v             # stop + delete volumes
# ══════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: balancecycle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-balancecycle}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"        # expose for local DB tools (TablePlus, DBeaver, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-balancecycle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ── Ollama (local LLM) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: balancecycle_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama   # persist downloaded model weights
    ports:
      - "11434:11434"
    # GPU passthrough (NVIDIA) — comment out if no GPU available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ── Model pull — runs once to download llama3.1 ────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: balancecycle_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.1}"]
    restart: "no"           # one-shot; Docker won't restart it


  # ── FastAPI backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balancecycle_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL:     postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-balancecycle}
      OLLAMA_BASE_URL:  http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-llama3.1}
      ENVIRONMENT:      ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS:  ${ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8000:8000"        # expose for direct API access / Swagger UI
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ── React frontend (nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balancecycle_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"            # app accessible at http://localhost


volumes:
  pg_data:
    name: balancecycle_pg_data
  ollama_data:
    name: balancecycle_ollama_data
