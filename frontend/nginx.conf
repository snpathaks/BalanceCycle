server {
    listen 80;
    server_name _;

    # Gzip for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy /api/* → FastAPI backend ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Proxy /health → backend health check ────────────────────────────────
    location = /backend-health {
        proxy_pass http://backend:8000/health;
    }

    # ── Static assets — long cache ───────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React Router — serve index.html for all non-asset routes ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tiny health probe for the frontend container itself
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
