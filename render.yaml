# ══════════════════════════════════════════════════════════════════════
#  BalanceCycle — Render Blueprint (Infrastructure as Code)
#
#  Services defined:
#    1. balancecycle-db        — Managed PostgreSQL Database
#    2. balancecycle-backend   — FastAPI Web Service (Python/Docker)
#    3. balancecycle-frontend  — React Static Site with Global CDN
#
#  NOTE: Ollama LLM service is excluded (not cost-free on Render).
#        Use an external/local Ollama instance and set OLLAMA_BASE_URL
#        as a manual environment variable in the Render Dashboard if needed.
#
#  How to deploy on Render:
#    1. Push this repository to GitHub / GitLab.
#    2. In the Render Dashboard, click "New +" -> "Blueprint".
#    3. Connect your repository — Render will automatically create
#       and link all 3 services defined below.
# ══════════════════════════════════════════════════════════════════════

version: "1"

databases:
  # ── 1. PostgreSQL Database ──────────────────────────────────────────
  - name: balancecycle-db
    databaseName: balancecycle
    user: balancecycle_user
    plan: free                  # Change to 'starter' for production persistence
    region: oregon

services:
  # ── 2. FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: balancecycle-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free                  # Free or starter tier
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balancecycle-db
          property: connectionString
      # Set OLLAMA_BASE_URL manually in the Render Dashboard if using
      # an external Ollama instance (e.g. self-hosted or local tunnel).
      # - key: OLLAMA_BASE_URL
      #   value: https://your-ollama-instance.example.com
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"              # Or specify your frontend Render URL
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true     # Render auto-generates a secure random string

staticSites:
  # ── 3. React Frontend (Static Site with CDN) ────────────────────────
  - name: balancecycle-frontend
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: balancecycle-backend
          property: host
